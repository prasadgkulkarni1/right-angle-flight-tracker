<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Flight Tracker - Find Your Perfect Flight</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/static/manifest.json">

    <!-- Theme color for Android Chrome -->
    <meta name="theme-color" content="#0770e3">

    <!-- iOS meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Flight Tracker">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">

    <!-- General mobile meta -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Flight Tracker">
    <meta name="description" content="Intelligent flight price tracking with natural language search">
    <meta name="format-detection" content="telephone=no">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">

    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">✈️</span>
                    <h1>Flight Tracker</h1>
                </div>
                <div class="provider-selector">
                    <label for="providerSelect" class="provider-label">Flight Data Provider:</label>
                    <select id="providerSelect" class="provider-select">
                        <option value="">Loading providers...</option>
                    </select>
                    <span id="providerStatus" class="provider-status"></span>
                </div>
            </div>
        </header>

        <main class="main">
            <div class="search-section">
                <h2 class="search-title">Find Your Perfect Flight</h2>
                <p class="search-subtitle">Search flights using natural language - Price target is optional!</p>

                <div class="search-box">
                    <textarea id="queryInput"
                        placeholder="e.g., Flights from New York to London on June 15th..."
                        rows="1"></textarea>
                    <button id="sendBtn" class="send-btn">
                        <span>Search Flights</span>
                    </button>
                </div>

                <div class="example-section">
                    <div class="example-label">Popular searches</div>
                    <div class="example-queries">
                        <button class="example-btn"
                            onclick="fillExample('Flights from Sydney to Bangalore in June')">
                            SYD → BLR, June
                        </button>
                        <button class="example-btn"
                            onclick="fillExample('Return flights from NYC to Tokyo next week under $1500')">
                            NYC → Tokyo, $1500
                        </button>
                        <button class="example-btn"
                            onclick="fillExample('Flights from London to Paris on July 15')">
                            LHR → CDG, July 15
                        </button>
                        <button class="example-btn"
                            onclick="fillExample('Find return flights from SFO to JFK for Christmas under $800')">
                            SFO → JFK, Christmas, $800
                        </button>
                    </div>
                </div>
            </div>

            <div class="results-container" id="resultsContainer">
                <!-- Results will appear here -->
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
